name: Split regression tests

on:
  pull_request:
    paths:
      - "partition/split.py"
      - "tests/**"
      - "data/schema.py"
      - ".github/workflows/split-tests.yml"
  push:
    branches:
      - main
      - "fix/group-aware-data-split"
    paths:
      - "partition/split.py"
      - "tests/**"
      - "data/schema.py"
      - ".github/workflows/split-tests.yml"

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install --upgrade pip numpy pandas
      - name: Run split regression tests
        run: python -m unittest discover -s tests -v
